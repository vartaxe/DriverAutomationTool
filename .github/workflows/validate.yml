name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-and-integrity:
    name: PowerShell and integrity validation
    runs-on: windows-latest
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check whitespace errors
        shell: powershell
        run: |
          $CommitLine = git rev-list --parents -n 1 HEAD
          if (($CommitLine -split ' ').Count -gt 1) {
            git diff --check HEAD^ HEAD
          }
          else {
            git diff --check
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Parse PowerShell and XAML
        shell: powershell
        run: |
          $parseFailures = [System.Collections.Generic.List[string]]::new()
          Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -File -Include '*.ps1', '*.psm1', '*.psd1' |
            ForEach-Object {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName,
                [ref]$tokens,
                [ref]$errors
              ) | Out-Null
              if ($errors.Count -gt 0) {
                $parseFailures.Add("$($_.FullName): $($errors[0].Message)")
              }
            }

          Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -File -Filter '*.xaml' |
            ForEach-Object {
              try {
                [xml](Get-Content -LiteralPath $_.FullName -Raw -ErrorAction Stop) | Out-Null
              }
              catch {
                $parseFailures.Add("$($_.FullName): $($_.Exception.Message)")
              }
            }

          if ($parseFailures.Count -gt 0) {
            $parseFailures | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Run PowerShell regression harnesses
        shell: powershell
        run: |
          Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'Tests') -Filter 'Test-*.ps1' |
            Sort-Object Name |
            ForEach-Object {
              Write-Host "Running $($_.Name)..."
              & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $_.FullName
              if ($LASTEXITCODE -ne 0) {
                throw "$($_.Name) failed with exit code $LASTEXITCODE"
              }
            }

      - name: Run servicing and installation regression tests
        shell: powershell
        run: |
          Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force -ErrorAction Stop
          Import-Module Pester -RequiredVersion 6.2.0 -ErrorAction Stop
          $testRoot = Join-Path $env:GITHUB_WORKSPACE 'Tests'
          $tests = @(Get-ChildItem -LiteralPath $testRoot -Filter '*.Tests.ps1' -File | Sort-Object Name)
          if ($tests.Count -eq 0) {
            throw 'No Pester regression suites were found.'
          }
          $result = Invoke-Pester -Path $tests.FullName -Output Detailed -PassThru
          if ($null -eq $result -or $result.Result -ne 'Passed' -or $result.TotalCount -eq 0 -or
              $result.FailedCount -gt 0 -or $result.FailedContainersCount -gt 0 -or
              $result.FailedBlocksCount -gt 0 -or $result.SkippedCount -gt 0 -or $result.NotRunCount -gt 0) {
            throw 'Servicing and installation regression tests did not fully pass.'
          }

      - name: Verify file hash manifest
        shell: powershell
        run: |
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'Driver Automation Tool\FileHashes.md'
          $entries = foreach ($line in Get-Content -LiteralPath $manifestPath) {
            if ($line -match '^\|\s+[^|]+\s+\|\s+`(?<path>[^`]+)`\s+\|\s+(?<size>[0-9.]+)\s+\|\s+`(?<hash>[0-9A-Fa-f]{64})`\s+\|$') {
              [pscustomobject]@{
                Path = $Matches.path
                Size = [double]$Matches.size
                Hash = $Matches.hash
              }
            }
          }

          if ($entries.Count -ne 20) {
            throw "Expected 20 manifest entries, found $($entries.Count)."
          }

          $failures = [System.Collections.Generic.List[string]]::new()
          foreach ($entry in $entries) {
            $path = Join-Path $env:GITHUB_WORKSPACE ('Driver Automation Tool\' + $entry.Path.Replace('/', '\'))
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              $failures.Add("$($entry.Path): file not found")
              continue
            }

            $actualHash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
            $actualSize = [math]::Round((Get-Item -LiteralPath $path).Length / 1KB, 1)
            if ($actualHash -cne $entry.Hash -or $actualSize -ne $entry.Size) {
              $failures.Add("$($entry.Path): expected $($entry.Hash), $($entry.Size) KB; found $actualHash, $actualSize KB")
            }
          }

          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Error $_ }
            exit 1
          }
